name: YouTube Daily Monitor

on:
  schedule:
    # KST 기준 매일 09:17 실행 (UTC 00:17) — Actions 지연 감안
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "텔레그램·KV 미게시, data 브랜치 미커밋으로 실행"
        type: boolean
        default: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 전일 비교용 previous_data.json 복원 (repo 쓰기 권한/커밋 불필요, 첫 실행은 캐시 없이 진행)
      - name: Restore previous day data
        uses: actions/cache/restore@v4
        with:
          path: previous_data.json
          key: prev-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            prev-data-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Monitoring Script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ !inputs.dry_run && secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ !inputs.dry_run && secrets.TELEGRAM_CHAT_ID || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          CF_ACCOUNT_ID: ${{ !inputs.dry_run && secrets.CF_ACCOUNT_ID || '' }}
          CF_KV_NAMESPACE_ID: ${{ !inputs.dry_run && secrets.CF_KV_NAMESPACE_ID || '' }}
          CF_API_TOKEN: ${{ !inputs.dry_run && secrets.CF_API_TOKEN || '' }}
        run: python -u main.py

      - name: Save current data for next run
        if: ${{ always() && !inputs.dry_run && hashFiles('previous_data.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: previous_data.json
          key: prev-data-${{ github.run_id }}-${{ github.run_attempt }}

      # [10/27 QA] 수집 원본 CSV 보관 (리포트 수치 대조용)
      - name: Upload raw collection CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-csv-${{ github.run_id }}-${{ github.run_attempt }}
          path: raw_csv/*.csv
          if-no-files-found: warn
          retention-days: 7

      - name: Commit raw CSV to data branch
        if: ${{ always() && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(raw_csv/*.csv)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no raw_csv; skip data branch commit"
            exit 0
          fi
          DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          DEST="raw_csv/${DATE}"
          WORK="/tmp/data-branch-$$"
          rm -rf "$WORK"
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git clone --depth 1 --branch data "$REPO_URL" "$WORK"
          else
            mkdir -p "$WORK"
            git -C "$WORK" init
            git -C "$WORK" checkout -b data
            git -C "$WORK" remote add origin "$REPO_URL"
          fi
          mkdir -p "$WORK/$DEST"
          cp "${files[@]}" "$WORK/$DEST/"
          git -C "$WORK" config user.name "github-actions[bot]"
          git -C "$WORK" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$WORK" add "$DEST"
          if git -C "$WORK" diff --cached --quiet; then
            echo "nothing new on data branch"
            exit 0
          fi
          git -C "$WORK" commit -m "data: ${DATE} raw CSV (${{ github.run_id }})"
          git -C "$WORK" push -u origin data
