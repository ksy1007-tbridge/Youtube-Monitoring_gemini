name: YouTube Daily Monitor

on:
  schedule:
    # KST 기준 매일 09:17 실행 (UTC 00:17) — Actions 지연 감안
    - cron: '17 0 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 전일 비교용 previous_data.json 복원 (repo 쓰기 권한/커밋 불필요, 첫 실행은 캐시 없이 진행)
      - name: Restore previous day data
        uses: actions/cache/restore@v4
        with:
          path: previous_data.json
          key: prev-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            prev-data-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Monitoring Script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Save current data for next run
        if: always() && hashFiles('previous_data.json') != ''
        uses: actions/cache/save@v4
        with:
          path: previous_data.json
          key: prev-data-${{ github.run_id }}-${{ github.run_attempt }}
