name: YouTube Daily Monitor

on:
  schedule:
  # UTC 기준 00:00 = 한국 시간(KST) 오전 09:00
  - cron: '0 0 * * *'
  # UTC 기준 09:00 = 한국 시간(KST) 오후 06:00
  - cron: '0 9 * * *'
  workflow_dispatch: # GitHub 웹 페이지에서 수동으로 실행 테스트 가능하게 설정

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # 스크립트 무한 대기 방지 (필요 시 시간 조절)

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip' # pip 패키지 캐싱 적용으로 빌드 속도 향상

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Monitoring Script
      env:
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main.py